<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'home' %}">SN</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a {% if request.path == "/" %}
            class="nav-link active"
            {% else %}
            class="nav-link"
            {% endif %} aria-current="page" href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Home</a>
          </li>
          <li class="nav-item">
            <a {% if request.path == "/contact_us/" %}
            class="nav-link active"
            {% else %}
            class="nav-link"
            {% endif %} href="{% url 'contact_us' %}"><i class="fa-solid fa-address-book"></i> contats us</a>
          </li>
        </ul>
        {% comment %} <form class="d-flex">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form> {% endcomment %}
      </div>
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link" aria-current="page" href="{% url 'profile' user.username %}"><i class="fa-solid fa-user"></i> {{user.username}}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" href="{% url 'logout' %}"><i class="fa-solid fa-right-from-bracket"></i> logout</a>

        {% else %}
        <li class="nav-item">
          <a {% if request.path == "/login/" %}
          class="nav-link active"
          {% else %}

        </li>

          <a {% if request.path == "/signup/" %}

          {% else %}
          class="nav-link"
